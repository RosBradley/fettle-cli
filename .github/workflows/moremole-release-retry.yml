name: MoreMole release retry

# MoreMole: when GitHub has no Apple-silicon Mac free, the release job waits
# 15 minutes, is cancelled without running a single step, and the run counts
# as failed. This starts that run again, up to six tries in all. A release
# that ran and failed (a test, the build) is left alone, and so is one you
# cancelled, which ends as cancelled rather than failed.

on:
  workflow_run:
    workflows: ['MoreMole release']
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    name: Try again when no Mac took the job
    if: >-
      github.repository == 'RosBradley/moremole' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 6
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the release again if none of its steps ran
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          steps=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --jq '[.jobs[].steps | length] | add // 0')
          if [ "$steps" != "0" ]; then
            echo "Try $ATTEMPT ran $steps steps and failed on its own, so it isn't started again."
            exit 0
          fi
          echo "No Mac took try $ATTEMPT; starting try $((ATTEMPT + 1))."
          gh run rerun "$RUN_ID" -R "$REPO"
