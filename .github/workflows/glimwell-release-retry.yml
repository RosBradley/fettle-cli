name: Glimwell release retry

# Glimwell: when GitHub has no Apple-silicon Mac free, the release job waits
# 15 minutes, is cancelled without running a single step, and the run counts
# as failed. This starts that run again, up to six tries in all. A release
# that ran and failed (a test, the build) is left alone, and so is one you
# cancelled, which ends as cancelled rather than failed.
#
# The tries all happen in this one job: a rerun started with GitHub's own
# token may not start this workflow again, so the job starts each try,
# waits until a Mac takes it or it ends, and starts the next. A try this job
# started is skipped here, in case GitHub does start the workflow for it.

on:
  workflow_run:
    workflows: ['Glimwell release']
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    name: Try again when no Mac took the job
    if: >-
      github.repository == 'RosBradley/glimwell-cli' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 6 &&
      github.event.workflow_run.triggering_actor.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Five more tries of up to about 16 minutes each.
    timeout-minutes: 100
    permissions:
      actions: write
    steps:
      - name: Start the release again until a Mac takes it, six tries in all
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          steps_of() {
            gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$1/jobs" --jq '[.jobs[].steps | length] | add // 0'
          }
          attempt="$ATTEMPT"
          while :; do
            steps=$(steps_of "$attempt")
            if [ "$steps" != "0" ]; then
              echo "Try $attempt ran $steps steps and failed on its own, so it isn't started again."
              exit 0
            fi
            if [ "$attempt" -ge 6 ]; then
              echo "No Mac took any of $attempt tries. Start the release again later with: gh run rerun $RUN_ID -R $REPO"
              exit 1
            fi
            echo "No Mac took try $attempt; starting try $((attempt + 1))."
            gh run rerun "$RUN_ID" -R "$REPO"
            attempt=$((attempt + 1))
            # Wait until a Mac takes the try (its first step starts) or it ends.
            while :; do
              sleep 30
              read -r now status conclusion < <(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '"\(.run_attempt) \(.status) \(.conclusion)"')
              [ "$now" = "$attempt" ] || continue
              steps=$(steps_of "$attempt") || continue
              if [ "$steps" != "0" ]; then
                echo "A Mac took try $attempt."
                exit 0
              fi
              [ "$status" = "completed" ] || continue
              if [ "$conclusion" != "failure" ]; then
                echo "Try $attempt ended $conclusion, so it isn't started again."
                exit 0
              fi
              break
            done
          done
